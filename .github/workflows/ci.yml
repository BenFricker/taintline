name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave a git token on the runner

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: auto

      - name: Install dependencies exactly as locked
        run: uv sync --locked

      - name: Lint (ruff, incl. security rules)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright, strict)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest

      - name: Dependency vulnerability audit (pip-audit)
        run: uv run pip-audit --skip-editable

      - name: Generate SBOM of runtime dependencies (CycloneDX)
        run: |
          uv export --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements.txt
          uv run cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
